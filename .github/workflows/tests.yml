name: Code tests
on:
  push:
    branches: ['main', 'codex/**']
    paths: ['carmgz/**', 'tests/**', 'scripts/**', 'web/**', 'cloudflare/**', 'package.json', 'pnpm-lock.yaml', 'publishers.json', 'coverage.json', '.github/workflows/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -q
      - name: Strict Windows cp1252 console regression
        if: runner.os == 'Windows'
        env:
          PYTHONIOENCODING: cp1252:strict
        run: python -m unittest discover -s tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/app.js
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm run build:guard
